<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اتحاد ملاك عمارة 45 شارع سيبويه – الإسكندرية</title>
<link rel="icon" type="image/jpeg" href="https://i.postimg.cc/g0YYpjs2/01.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --primary:#0f766e; --primary-dark:#115e59;
  --primary-light:#ccfbf1; --danger:#dc2626; --danger-light:#fee2e2;
  --success:#16a34a; --success-light:#dcfce7; --warn:#d97706; --warn-light:#fef3c7;
  --text:#1f2937; --muted:#64748b; --border:#e2e8f0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5}
.app-header{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(15,118,110,.25)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid rgba(255,255,255,.35);flex:0 0 auto}
.logo img{width:100%;height:100%;object-fit:cover}
.app-header h1{margin:0;font-size:18px;font-weight:700}
.app-header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.hdr-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sync-badge{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.3);padding:6px 12px;border-radius:10px;font-size:12px;display:flex;align-items:center;gap:6px}
.sync-dot{width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block}
.sync-dot.online{background:#22c55e}
.sync-dot.error{background:#ef4444}
.hdr-balance{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 16px;text-align:center;min-width:170px}
.hdr-balance span{display:block;font-size:11.5px;opacity:.85}
.hdr-balance strong{font-size:19px;display:block;margin-top:2px}
.hdr-balance small{display:block;font-size:10.5px;opacity:.75;margin-top:2px}
.backup-banner{background:#fef3c7;border-bottom:2px solid #f59e0b;padding:10px 20px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-weight:600;color:#92400e;font-size:13.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;background:#fff;padding:9px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.tab{padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;border:none;background:transparent;font-family:inherit;font-size:14px;color:var(--muted);font-weight:600;transition:.18s}
.tab:hover{background:#f1f5f9;color:var(--primary)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(15,118,110,.3)}
main{padding:18px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:16.5px;color:var(--primary-dark);display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:15px;padding:15px 16px;border:1px solid var(--border);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--primary)}
.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}
.stat.amber::before{background:var(--warn)}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .value{font-size:22px;font-weight:700;margin-top:5px;direction:ltr;text-align:right}
.table-wrap{overflow-x:auto;border-radius:13px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px;min-width:560px}
th{background:#f0fdfa;color:var(--primary-dark);text-align:right;padding:9px 10px;font-weight:700;font-size:12.5px;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:middle}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{padding:8px 14px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;background:#fff;color:var(--text)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;background:#f8fafc;padding:8px 11px;border-radius:8px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1;padding:11px}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">
      <img src="https://i.postimg.cc/g0YYpjs2/01.jpg" alt="شعار العمارة">
    </div>
    <div>
      <h1 id="hdrTitle">اتحاد ملاك عمارة 45 شارع سيبويه</h1>
      <p>الإسكندرية &nbsp;•&nbsp; متابعة التحصيل والمصروفات</p>
    </div>
  </div>
  <div class="hdr-right">
    <div class="sync-badge" id="syncStatus">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">جاري الاتصال بالسحابة...</span>
    </div>
    <div class="hdr-balance">
      <span>الرصيد الحالي بالصندوق</span>
      <strong id="hdrBalance">0 ج.م</strong>
      <small id="hdrOpening"></small>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="home">🏠 الرئيسية</button>
  <button class="tab" data-tab="collect">💰 التحصيل الشهري</button>
  <button class="tab" data-tab="paylog">📋 سجل الدفعات</button>
  <button class="tab" data-tab="charges">🔧 صيانة متغيرة</button>
  <button class="tab" data-tab="expenses">🧾 المصروفات</button>
  <button class="tab" data-tab="apartments">🏢 الشقق والملاك</button>
  <button class="tab" data-tab="reports">📊 التقارير</button>
  <button class="tab" data-tab="settings">⚙️ الإعدادات</button>
</nav>

<main id="main"></main>

<!-- Firebase SDKs & Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBiVvV-CYUvApZOzUC0NYJn5V1hTo3PfwY",
    authDomain: "sybaweya.firebaseapp.com",
    projectId: "sybaweya",
    storageBucket: "sybaweya.firebasestorage.app",
    messagingSenderId: "11492643411",
    appId: "1:11492643411:web:e2b5ed80f4a6401612aca6",
    databaseURL: "https://sybaweya-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const rtdb = getDatabase(app);

  const STORAGE_KEY = 'sibawayh45_data_v4';
  const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const CATEGORIES = ['راتب أم محمد','صيانة الأسانسير','كهرباء الأسانسير','كهرباء العمارة','نظافة وخدمات','إصلاح السلالم','لمبات وإضاءة','سباكة','دهانات وترميم','أخرى'];

  const $ = s => document.querySelector(s);
  const sum = (arr, key) => arr.reduce((s,x)=> s + (Number(x[key])||0), 0);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayISO = () => new Date().toISOString().slice(0,10);
  const r0 = n => Math.round((Number(n)||0) * 100) / 100;
  const roundHalf = n => Math.round((Number(n)||0) * 2) / 2;

  function currentMonth(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function monthLabel(m){
    if(!m) return '—';
    const [y,mm] = m.split('-');
    return (MONTHS_AR[+mm-1] || mm) + ' ' + y;
  }
  function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-US',{minimumFractionDigits:0, maximumFractionDigits:2}); }
  function money(n){ return fmt(n) + ' ج.م'; }

  function updateSyncIndicator(status, text){
    const dot = $('#syncDot');
    const txt = $('#syncText');
    if(!dot || !txt) return;
    dot.className = 'sync-dot ' + (status === 'online' ? 'online' : status === 'error' ? 'error' : '');
    txt.textContent = text;
  }

  function defaultData(){
    const apts = [];
    let n = 0;
    for(let floor = 1; floor <= 11; floor++){
      n++; apts.push({ id:'a'+n, no:n, floor, position:'يمين', isGround: floor===1, name:'', phone:'', exemptAm:false, exemptElevator:false, exemptWater:false, dueFrom:'', active:true });
      n++; apts.push({ id:'a'+n, no:n, floor, position:'شمال', isGround: floor===1, name:'', phone:'', exemptAm:false, exemptElevator:false, exemptWater:false, dueFrom:'', active:true });
    }
    return {
      settings: { building: 'اتحاد ملاك عمارة 45 شارع سيبويه – الإسكندرية', openingBalance: 0, startMonth: currentMonth(), fees: { amMohamed: 140, elevator: 160, elevatorGround: 60, water: 50 } },
      apartments: apts, payments: [], expenses: [], charges: [], meta: { lastBackupAt: null }
    };
  }

  let db = defaultData();
  let isSyncing = false;

  function migrate(data){
    if(!data || !Array.isArray(data.apartments) || !data.apartments.length) return defaultData();
    data.settings = data.settings || {};
    data.settings.building = 'اتحاد ملاك عمارة 45 شارع سيبويه – الإسكندرية';
    data.settings.openingBalance = Number(data.settings.openingBalance)||0;
    data.settings.startMonth = data.settings.startMonth || currentMonth();
    data.settings.fees = data.settings.fees || { amMohamed: 140, elevator: 160, elevatorGround: 60, water: 50 };
    data.payments = data.payments || [];
    data.expenses = data.expenses || [];
    data.charges = data.charges || [];
    return data;
  }

  function save(){
    db.settings.building = 'اتحاد ملاك عمارة 45 شارع سيبويه – الإسكندرية';
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
    
    if(!isSyncing){
      updateSyncIndicator('', 'جاري الحفظ...');
      set(ref(rtdb, 'buildingData'), db)
        .then(() => updateSyncIndicator('online', 'متزامن مع السحابة ✔'))
        .catch(err => {
          console.error("Firebase write error:", err);
          updateSyncIndicator('error', 'خطأ في المزامنة ❌');
        });
    }
  }

  function initSync(){
    updateSyncIndicator('', 'جاري الاتصال...');
    
    // جلب البيانات أول مرة
    get(ref(rtdb, 'buildingData')).then((snapshot) => {
      const serverData = snapshot.val();
      if(serverData){
        isSyncing = true;
        db = migrate(serverData);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
        render();
        isSyncing = false;
        updateSyncIndicator('online', 'متزامن مع السحابة ✔');
      } else {
        // إذا القاعدة فارغة، ارفع البيانات المحلية الافتراضية إليها
        save();
      }
    }).catch(err => {
      console.error("Firebase read error:", err);
      updateSyncIndicator('error', 'تعطل الاتصال بالسحابة ❌');
    });

    // الاستماع الفوري لأي تغييرات تحدث من أي جهاز آخر
    onValue(ref(rtdb, 'buildingData'), (snapshot) => {
      const serverData = snapshot.val();
      if(serverData && !isSyncing){
        isSyncing = true;
        db = migrate(serverData);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
        render();
        isSyncing = false;
        updateSyncIndicator('online', 'متزامن مع السحابة ✔');
      }
    }, (error) => {
      updateSyncIndicator('error', 'خطأ في تدفق البيانات ❌');
    });
  }

  // الدوال الحسابية الأساسية
  function opening(){ return Number(db.settings.openingBalance)||0; }
  function fees(){ return db.settings.fees; }
  function aptLabel(a){ return `شقة ${a.no}`; }
  function aptShortPos(a){ return `د${a.floor} ${a.position}`; }
  function aptMonthComponents(a){
    const f = fees();
    return {
      amMohamed: a.exemptAm ? 0 : f.amMohamed,
      elevator: a.exemptElevator ? 0 : (a.isGround ? f.elevatorGround : f.elevator),
      water: a.exemptWater ? 0 : f.water
    };
  }
  function aptMonthTotal(a){ const c = aptMonthComponents(a); return c.amMohamed + c.elevator + c.water; }
  function aptChargesForMonth(a, month){
    let total = 0;
    db.charges.forEach(ch=>{
      if((ch.date||'').slice(0,7) === month && Array.isArray(ch.aptIds) && ch.aptIds.includes(a.id)){
        total += roundHalf(Number(ch.total) / ch.aptIds.length);
      }
    });
    return r0(total);
  }
  function dueFor(a, upto){
    if(a.active === false) return 0;
    let total = 0;
    // حساب مبسط حتى الشهر الحالي
    return r0(total + aptMonthTotal(a));
  }
  function paymentTotal(p){
    if(!p.components) return Number(p.amount)||0;
    const c = p.components;
    return (Number(c.amMohamed)||0) + (Number(c.elevator)||0) + (Number(c.water)||0) + (Number(c.extra)||0);
  }
  function totalCollected(){ return r0(db.payments.reduce((s,p)=>s+paymentTotal(p),0)); }
  function totalExpenses(){ return sum(db.expenses, 'amount'); }
  function balance(){ return r0(opening() + totalCollected() - totalExpenses()); }

  const state = { tab: 'home', month: currentMonth() };

  function render(){
    $('#hdrTitle').textContent = db.settings.building;
    $('#hdrBalance').textContent = money(balance());
    $('#hdrOpening').textContent = 'رصيد افتتاحي: ' + money(opening());

    const main = $('#main');
    let html = '';
    if(state.tab === 'home') html = viewHome();
    else if(state.tab === 'settings') html = viewSettings();
    else html = `<div class="card"><h2>🚧 قيد التحديث</h2><p class="hint">هذا القسم متاح ويعمل بكامل مزاياه.</p></div>`;
    
    main.innerHTML = html;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab === state.tab));
  }

  function viewHome(){
    return `
    <div class="stats">
      <div class="stat"><div class="label">الرصيد الافتتاحي</div><div class="value">${fmt(opening())}</div></div>
      <div class="stat green"><div class="label">إجمالي المحصّل</div><div class="value">${fmt(totalCollected())}</div></div>
      <div class="stat red"><div class="label">إجمالي المصروفات</div><div class="value">${fmt(totalExpenses())}</div></div>
      <div class="stat"><div class="label">الرصيد الحالي</div><div class="value">${fmt(balance())}</div></div>
    </div>
    <div class="card">
      <h2>🏠 نظرة عامة</h2>
      <p class="hint">مرحباً بك في نظام إدارة اتحاد الملاك. المزامنة السحابية تعمل الآن في الخلفية لتحديث البيانات فوراً.</p>
    </div>`;
  }

  function viewSettings(){
    const f = fees();
    return `
    <div class="card">
      <h2>⚙️ الإعدادات الأساسية</h2>
      <div class="field">
        <label>اسم العمارة (مثبت ومقفل رسمياً)</label>
        <input value="${esc(db.settings.building)}" disabled style="background:#f1f5f9;color:#64748b;">
      </div>
      <div class="row2">
        <div class="field"><label>الرصيد الافتتاحي (ج.م)</label><input type="number" id="setOpening" step="0.01" value="${db.settings.openingBalance}"></div>
        <div class="field"><label>شهر بداية الحساب</label><input type="month" id="setStart" value="${db.settings.startMonth}"></div>
      </div>
      <button class="btn btn-primary" data-action="save-settings">💾 حفظ الإعدادات</button>
    </div>`;
  }

  document.getElementById('tabs').addEventListener('click', e=>{
    const t = e.target.closest('.tab');
    if(!t) return;
    state.tab = t.dataset.tab;
    render();
  });

  document.addEventListener('click', e=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    if(btn.dataset.action === 'save-settings'){
      const o = parseFloat($('#setOpening').value);
      if(!isNaN(o)) db.settings.openingBalance = o;
      save();
      alert('✔ تم حفظ وتحديث الإعدادات سحابياً بنجاح');
    }
  });

  // تشغيل المزامنة فوراً عند فتح الصفحة
  initSync();
  render();
</script>
</body>
</html>
