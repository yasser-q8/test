function handleFileUpload(e) {
    const file = e.target.files[0];
    if(!file) return;

    document.getElementById('fileStatus').textContent = `جاري قراءة الملف وتحليل الفروع بدقة...`;
    const reader = new FileReader();

    reader.onload = function(evt) {
        try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

            if(rows.length === 0) {
                alert('الملف المرفق فارغ');
                return;
            }

            globalRawData = rows;

            globalHeaderRowIdx = 0;
            siteColIdx = -1;
            inColIdx = -1;
            outColIdx = -1;
            dateColIdx = -1;

            for(let i = 0; i < Math.min(25, rows.length); i++) {
                const row = rows[i];
                for(let j = 0; j < row.length; j++) {
                    const cellVal = String(row[j] || '').trim().toLowerCase();
                    if(cellVal.includes('site name') || cellVal === 'site' || cellVal.includes('اسم المطعم')) {
                        siteColIdx = j;
                        globalHeaderRowIdx = i;
                    }
                    if(cellVal.includes('transfer in') || cellVal === 'in' || cellVal.includes('وارد')) {
                        inColIdx = j;
                        globalHeaderRowIdx = i;
                    }
                    if(cellVal.includes('transfer out') || cellVal === 'out' || cellVal.includes('صادر')) {
                        outColIdx = j;
                        globalHeaderRowIdx = i;
                    }
                    if(cellVal.includes('date') || cellVal.includes('time') || cellVal.includes('التاريخ') || cellVal.includes('الوقت') || cellVal.includes('الشهر')) {
                        if(dateColIdx === -1) dateColIdx = j;
                    }
                }
                if(siteColIdx !== -1 && inColIdx !== -1 && outColIdx !== -1) break;
            }

            // تصحيح تعيين القيم الافتراضية باستخدام المتغيرات الصحيحة
            if(siteColIdx === -1) siteColIdx = 4;
            if(inColIdx === -1) inColIdx = 14;
            if(outColIdx === -1) outColIdx = 17;

            processDataAndReports();
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('fileStatus').textContent = `تمت معالجة الملف بنجاح (${rows.length - globalHeaderRowIdx - 1} صف).`;

        } catch(err) {
            alert('حدث خطأ أثناء قراءة ملف الاكسل: ' + err.message);
            document.getElementById('fileStatus').textContent = 'خطأ في معالجة الملف';
        }
    };
    reader.readAsArrayBuffer(file);
}

function processDataAndReports() {
    const countsIn = {};
    const countsOut = {};
    const monthlyData = {};

    for(let i = globalHeaderRowIdx + 1; i < globalRawData.length; i++) {
        const row = globalRawData[i];
        if(!row) continue;

        const siteVal = row[siteColIdx] ? String(row[siteColIdx]).trim() : '';
        const inVal = row[inColIdx];
        const outVal = row[outColIdx];
        
        let monthKey = 'شهر غير محدد';
        if(dateColIdx !== -1 && row[dateColIdx]) {
            let rawDate = row[dateColIdx];
            if(typeof rawDate === 'number') {
                const d = new Date(Math.round((rawDate - (25567 + 2)) * 86400 * 1000));
                monthKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            } else {
                let dateStr = String(rawDate).trim();
                let match = dateStr.match(/\d{4}[-/]\d{1,2}/) || dateStr.match(/\d{1,2}[-/]\d{4}/) || dateStr.match(/^[A-Za-z]+ \d{4}/);
                if(match) monthKey = match[0];
                else if(dateStr.length >= 7) monthKey = dateStr.substring(0, 7);
            }
        }

        if(siteVal) {
            if(!countsIn[siteVal]) countsIn[siteVal] = 0;
            if(!countsOut[siteVal]) countsOut[siteVal] = 0;

            let hasIn = false;
            let hasOut = false;

            if(inVal !== undefined && inVal !== '' && inVal !== null) {
                let numIn = parseFloat(inVal);
                if(!isNaN(numIn) && numIn !== 0) {
                    countsIn[siteVal] += 1;
                    hasIn = true;
                }
            }

            if(outVal !== undefined && outVal !== '' && outVal !== null) {
                let numOut = parseFloat(outVal);
                if(!isNaN(numOut) && numOut !== 0) {
                    countsOut[siteVal] += 1;
                    hasOut = true;
                }
            }

            if(hasIn || hasOut) {
                if(!monthlyData[siteVal]) monthlyData[siteVal] = {};
                if(!monthlyData[siteVal][monthKey]) monthlyData[siteVal][monthKey] = { in: 0, out: 0 };
                if(hasIn) monthlyData[siteVal][monthKey].in += 1;
                if(hasOut) monthlyData[siteVal][monthKey].out += 1;
            }
        }
    }

    // مطابقة تامة لكل فرع في قاعدة البيانات (Exact Match فقط لمنع تداخل أسماء مثل Farwaniya و New Farwaniya)
    aggregatedGeneral = NAIF_RESTAURANTS_DB.map(rest => {
        let matchedIn = 0;
        let matchedOut = 0;

        Object.keys(countsIn).forEach(k => {
            const kClean = k.toLowerCase().trim();
            const siteClean = rest.siteName.toLowerCase().trim();
            const restClean = rest.restAr.toLowerCase().trim();

            if(kClean === siteClean || kClean === restClean) {
                matchedIn += countsIn[k] || 0;
                matchedOut += countsOut[k] || 0;
            }
        });

        return {
            ...rest,
            inCount: matchedIn,
            outCount: matchedOut,
            totalCount: matchedIn + matchedOut
        };
    });

    aggregatedMonthly = NAIF_RESTAURANTS_DB.map(rest => {
        let matchedMonths = {};
        let totalIn = 0;
        let totalOut = 0;

        Object.keys(monthlyData).forEach(k => {
            const kClean = k.toLowerCase().trim();
            const siteClean = rest.siteName.toLowerCase().trim();
            const restClean = rest.restAr.toLowerCase().trim();

            if(kClean === siteClean || kClean === restClean) {
                const mObj = monthlyData[k];
                Object.keys(mObj).forEach(m => {
                    if(!matchedMonths[m]) matchedMonths[m] = { in: 0, out: 0 };
                    matchedMonths[m].in += mObj[m].in;
                    matchedMonths[m].out += mObj[m].out;
                    totalIn += mObj[m].in;
                    totalOut += mObj[m].out;
                });
            }
        });

        let activeMonthsCount = Object.keys(matchedMonths).length || 1;
        let avgPerMonth = Math.round(((totalIn + totalOut) / activeMonthsCount) * 10) / 10;
        let productivityIndex = avgPerMonth > 100 ? 'عالية الكثافة (مكثف)' : (avgPerMonth > 40 ? 'متوسطة الإنتاجية' : 'خفيفة / مستقرة');

        return {
            ...rest,
            monthsDetail: matchedMonths,
            totalIn: totalIn,
            totalOut: totalOut,
            totalCount: totalIn + totalOut,
            avgPerMonth: avgPerMonth,
            productivityIndex: productivityIndex
        };
    });

    if(currentTab === 'general') renderGeneralTable(aggregatedGeneral);
    else renderMonthlyTable(aggregatedMonthly);
}

            <th>عدد التحويلات الخارجة (OUT)</th>

}

function filterResults() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    if(!q) {
        if(currentTab === 'general') renderGeneralTable(aggregatedGeneral);
        else renderMonthlyTable(aggregatedMonthly);
        return;
    }
    
    if(currentTab === 'general') {
        const filtered = aggregatedGeneral.filter(r => 
            r.restAr.toLowerCase().includes(q) ||
            r.siteName.toLowerCase().includes(q) ||
            r.areaManager.toLowerCase().includes(q) ||
            r.opsManager.toLowerCase().includes(q)
        );
        renderGeneralTable(filtered);
    } else {
        const filtered = aggregatedMonthly.filter(r => 
            r.restAr.toLowerCase().includes(q) ||
            r.siteName.toLowerCase().includes(q) ||
            r.areaManager.toLowerCase().includes(q) ||
            r.opsManager.toLowerCase().includes(q)
        );
        renderMonthlyTable(filtered);
    }
}

function exportToExcel() {
    let exportData = [];
    let sheetName = "";

    if(currentTab === 'general') {
        sheetName = "التقرير العام للتحويلات";
        exportData = aggregatedGeneral.map((item, idx) => ({
            'م': idx + 1,
            'اسم المطعم': item.restAr,
            'Site Name': item.siteName,
            'مدير المنطقة': item.areaManager,
            'مدير التشغيل': item.opsManager,
            'عدد التحويلات الداخلة (IN)': item.inCount,
            'عدد التحويلات الخارجة (OUT)': item.outCount,
            'إجمالي عدد الحركات': item.totalCount
        }));
    } else {
        sheetName = "التقرير الشهري وإنتاجية الوقت";
        exportData = aggregatedMonthly.map((item, idx) => ({
            'م': idx + 1,
            'اسم المطعم': item.restAr,
            'Site Name': item.siteName,
            'مدير المنطقة': item.areaManager,
            'مدير التشغيل': item.opsManager,
            'إجمالي الداخل (IN)': item.totalIn,
            'إجمالي الخارج (OUT)': item.totalOut,
            'إجمالي الحركات': item.totalCount,
            'المعدل الشهري': item.avgPerMonth,
            'مؤشر إنتاجية الوقت': item.productivityIndex
        }));
    }

    const ws = XLSX.utils.json_to_sheet(exportData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, `${sheetName.replace(/ /g, '_')}_نايف.xlsx`);
}

    container.style.width = '794px';
    container.style.background = '#ffffff';

    const safeHeight = 1050;
    let currentPage = createPdfPage(container);

    currentPage.innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid #c62828; padding-bottom:10px; margin-bottom:15px;">
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="https://i.postimg.cc/NM2zJWZD/NAIF-LOGO.jpg" style="height:45px; border-radius:6px;">
                <div>
                    <h3 style="margin:0; color:#c62828;">شركة نايف للأغذية</h3>
                    <span style="font-size:0.8rem; color:#555;">${reportTitle}</span>
                </div>
            </div>
            <div style="text-align:left; font-size:0.75rem; color:#666;">
                التاريخ: ${new Date().toLocaleDateString('en-GB')}<br>
                عدد الفروع: ${currentDataToExport.length}
            </div>
        </div>
    `;

    const tableWrap = document.createElement('div');
    let tableHtml = '';

    if(isGen) {
        tableHtml = `
            <table style="width:100%; border-collapse:collapse; font-size:0.7rem; text-align:right;">
                <thead>
                    <tr style="background:#c62828; color:white;">
                        <th style="padding:6px; border:1px solid #ddd;">م</th>
                        <th style="padding:6px; border:1px solid #ddd;">المطعم</th>
                        <th style="padding:6px; border:1px solid #ddd;">Site Name</th>
                        <th style="padding:6px; border:1px solid #ddd;">مدير المنطقة</th>
                        <th style="padding:6px; border:1px solid #ddd;">مدير التشغيل</th>
                        <th style="padding:6px; border:1px solid #ddd;">داخل (IN)</th>
                        <th style="padding:6px; border:1px solid #ddd;">خارج (OUT)</th>
                        <th style="padding:6px; border:1px solid #ddd;">الإجمالي</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>`;
    } else {
        tableHtml = `
            <table style="width:100%; border-collapse:collapse; font-size:0.7rem; text-align:right;">
                <thead>
                    <tr style="background:#c62828; color:white;">
                        <th style="padding:6px; border:1px solid #ddd;">م</th>
                        <th style="padding:6px; border:1px solid #ddd;">المطعم</th>
                        <th style="padding:6px; border:1px solid #ddd;">Site Name</th>
                        <th style="padding:6px; border:1px solid #ddd;">مدير المنطقة</th>
                        <th style="padding:6px; border:1px solid #ddd;">معدل شهري</th>
                        <th style="padding:6px; border:1px solid #ddd;">المؤشر الزمني</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>`;
    }

    tableWrap.innerHTML = tableHtml;
    currentPage.appendChild(tableWrap);
    let tbody = tableWrap.querySelector('tbody');

    currentDataToExport.forEach((item, idx) => {
        const tr = document.createElement('tr');

}

function createPdfPage(container) {
    const p = document.createElement('div');
    p.style.width = '794px';
    p.style.padding = '25px';
    p.style.background = '#ffffff';
    p.style.boxSizing = 'border-box';
    container.appendChild(p);
    return p;
}
