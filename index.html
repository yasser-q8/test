<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اتحاد ملاك عمارة 45 شارع سيبويه – الإسكندرية</title>
<!-- شعار العمارة كأيقونة للموقع -->
<link rel="icon" type="image/jpeg" href="https://i.postimg.cc/g0YYpjs2/01.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --primary:#0f766e; --primary-dark:#115e59;
  --primary-light:#ccfbf1; --danger:#dc2626; --danger-light:#fee2e2;
  --success:#16a34a; --success-light:#dcfce7; --warn:#d97706; --warn-light:#fef3c7;
  --text:#1f2937; --muted:#64748b; --border:#e2e8f0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);direction:rtl;font-size:15px;line-height:1.5}
.app-header{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 4px 14px rgba(15,118,110,.25)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid rgba(255,255,255,.35);flex:0 0 auto}
.logo img{width:100%;height:100%;object-fit:cover}
.app-header h1{margin:0;font-size:18px;font-weight:700}
.app-header p{margin:2px 0 0;font-size:12.5px;opacity:.85}
.hdr-balance{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 16px;text-align:center;min-width:170px}
.hdr-balance span{display:block;font-size:11.5px;opacity:.85}
.hdr-balance strong{font-size:19px;display:block;margin-top:2px}
.hdr-balance small{display:block;font-size:10.5px;opacity:.75;margin-top:2px}
.backup-banner{background:#fef3c7;border-bottom:2px solid #f59e0b;padding:10px 20px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;font-weight:600;color:#92400e;font-size:13.5px}
.backup-banner .btn{padding:6px 12px;font-size:12.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;background:#fff;padding:9px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;border:none;background:transparent;font-family:inherit;font-size:14px;color:var(--muted);font-weight:600;transition:.18s}
.tab:hover{background:#f1f5f9;color:var(--primary)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(15,118,110,.3)}
main{padding:18px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:16px}
.card h2{margin:0 0 14px;font-size:16.5px;color:var(--primary-dark);display:flex;align-items:center;gap:8px}
.card h2 .sub{font-size:12.5px;color:var(--muted);font-weight:400}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-title h2{margin:0;font-size:17px;color:var(--primary-dark)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:15px;padding:15px 16px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--primary)}
.stat.green::before{background:var(--success)}
.stat.red::before{background:var(--danger)}
.stat.amber::before{background:var(--warn)}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .value{font-size:22px;font-weight:700;margin-top:5px;direction:ltr;text-align:right}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
.table-wrap{overflow-x:auto;border-radius:13px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px;min-width:560px}
th{background:#f0fdfa;color:var(--primary-dark);text-align:right;padding:9px 10px;font-weight:700;font-size:12.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:#fafcfb}
tbody tr:first-child td{border-top:none}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mny{direction:rtl;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tfoot td{background:#f8fafc;font-weight:700;border-top:2px solid var(--border)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--success-light);color:#15803d}
.badge.part{background:var(--warn-light);color:#b45309}
.badge.no{background:var(--danger-light);color:#b91c1c}
.badge.off{background:#e2e8f0;color:#475569}
.btn{padding:8px 14px;border-radius:9px;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:700;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-ghost{background:#f1f5f9;color:var(--text)}
.btn-ghost:hover{background:#e2e8f0}
.btn-danger{background:var(--danger-light);color:var(--danger)}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn{background:transparent;border:none;font-size:17px;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:8px;line-height:1}
.icon-btn:hover{background:#f1f5f9;color:var(--danger)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:14px;background:#fff;color:var(--text);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary);cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
@media(max-width:700px){.row2,.row3,.row4{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0;background:#f8fafc;padding:8px 11px;border-radius:8px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow-y:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .18s ease}
.modal.wide{max-width:720px}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{margin:0;font-size:17px;color:var(--primary-dark)}
.modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}
.modal-actions .btn{flex:1;padding:11px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.chip{border-radius:11px;padding:8px 6px;text-align:center;font-weight:700;font-size:14px;border:1.5px solid transparent;line-height:1.25}
.chip small{display:block;font-size:10px;font-weight:400;opacity:.8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.ok{background:var(--success-light);color:#15803d;border-color:#86efac}
.chip.no{background:var(--danger-light);color:#b91c1c;border-color:#fca5a5}
.chip.part{background:var(--warn-light);color:#b45309;border-color:#fcd34d}
.chip.off{background:#f1f5f9;color:#94a3b8;border-color:#e2e8f0}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:14px}
.empty .big{font-size:36px;display:block;margin-bottom:8px;opacity:.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.month-nav{display:flex;align-items:center;gap:8px;background:#f8fafc;padding:6px;border-radius:11px;border:1px solid var(--border)}
.month-nav input[type=month]{border:none;background:transparent;font-weight:700;color:var(--primary-dark);width:auto;padding:5px 8px}
.month-nav input:focus{box-shadow:none}
.pdf-box{background:#f0fdfa;border:1.5px dashed #5eead4;border-radius:12px;padding:14px}
.apt-owner{font-size:11px;color:var(--muted);display:block}
.pay-cell{font-weight:700;font-size:12.5px}
.pay-cell small{font-weight:400;color:#94a3b8;font-size:10.5px}
.charge-apt-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;max-height:280px;overflow-y:auto;border:1px solid var(--border);padding:10px;border-radius:10px;background:#f8fafc}
.charge-apt-list label{display:flex;align-items:center;gap:7px;font-size:13px;padding:5px 8px;border-radius:8px;cursor:pointer;background:#fff;border:1px solid #e2e8f0}
.charge-apt-list label:hover{background:#f0fdfa}
.charge-apt-list label input{width:16px;height:16px;flex:0 0 auto}
.charge-apt-list label span{flex:1;font-size:12px}
.charge-summary{background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:13px;color:#92400e;font-weight:600}
.comp-cell{display:flex;align-items:center;gap:5px;justify-content:flex-start}
.comp-cell input[type=checkbox]{width:16px;height:16px;flex:0 0 auto}
.comp-cell .amt{font-weight:700;font-size:12.5px;color:#0f766e;direction:ltr}
.comp-cell.off .amt{color:#cbd5e1;text-decoration:line-through}
@media print{
  body{background:#fff;font-size:12px}
  .app-header,.tabs,.toolbar,.btn,.icon-btn,.no-print,.backup-banner{display:none!important}
  main{padding:0;max-width:100%}
  .card{border:none;box-shadow:none;padding:0;margin-bottom:14px;break-inside:avoid}
  table{font-size:11px;min-width:0}
}
</style>
</head>
<body>

<div id="backupBanner" class="backup-banner no-print" style="display:none">
  <span id="backupMsg">⚠️ لم تأخذ نسخة احتياطية منذ أكثر من 12 ساعة</span>
  <button class="btn btn-primary btn-sm" onclick="takeBackupNow()">⬇️ خذ نسخة الآن</button>

<header class="app-header">

      <img src="https://i.postimg.cc/g0YYpjs2/01.jpg" alt="شعار العمارة">

    <div>

<main id="main"></main>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBiVvV-CYUvApZOzUC0NYJn5V1hTo3PfwY",
    authDomain: "sybaweya.firebaseapp.com",
    projectId: "sybaweya",
    storageBucket: "sybaweya.firebasestorage.app",
    messagingSenderId: "11492643411",
    appId: "1:11492643411:web:e2b5ed80f4a6401612aca6",
    databaseURL: "https://console.firebase.google.com/u/0/project/sybaweya/database/sybaweya-default-rtdb/data/~2F"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const rtdb = getDatabase(firebaseApp);

  const STORAGE_KEY = 'sibawayh45_data_v4';
  const OLD_KEYS = ['sibawayh45_data_v3','sibawayh45_data_v2','sibawayh45_data_v1'];
  const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const CATEGORIES = ['راتب أم محمد','صيانة الأسانسير','كهرباء الأسانسير','كهرباء العمارة','نظافة وخدمات','إصلاح السلالم','لمبات وإضاءة','سباكة','دهانات وترميم','أخرى'];
  const BACKUP_HOURS = 12;

  const $  = s => document.querySelector(s);
  const sum = (arr, key) => arr.reduce((s,x)=> s + (Number(x[key])||0), 0);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayISO = () => new Date().toISOString().slice(0,10);
  const r0 = n => Math.round((Number(n)||0) * 100) / 100;
  const roundHalf = n => Math.round((Number(n)||0) * 2) / 2;

  function currentMonth(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function monthLabel(m){
    if(!m) return '—';
    const [y,mm] = m.split('-');
    return (MONTHS_AR[+mm-1] || mm) + ' ' + y;
  }
  function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-US',{minimumFractionDigits:0, maximumFractionDigits:2}); }
  function money(n){ return fmt(n) + ' ج.م'; }
  function monthDiff(a,b){
    const [ay,am] = a.split('-').map(Number);
    const [by,bm] = b.split('-').map(Number);
    return (by-ay)*12 + (bm-am);
  }
  function monthRange(from,to){
    const out = [];
    if(!from || !to) return out;
    let [y,m] = from.split('-').map(Number);
    const [ey,em] = to.split('-').map(Number);
    let guard = 0;
    while((y<ey || (y===ey && m<=em)) && guard++ < 600){
      out.push(`${y}-${String(m).padStart(2,'0')}`);
      m++; if(m>12){ m=1; y++; }
    }
    return out;
  }
  function download(filename, content, type='application/json;charset=utf-8'){
    const blob = new Blob([content], {type});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  function defaultData(){
    const apts = [];
    let n = 0;
    for(let floor = 1; floor <= 11; floor++){
      n++; apts.push({
        id:'a'+n, no:n, floor, position:'يمين', isGround: floor===1,
        name:'', phone:'',
        exemptAm:false, exemptElevator:false, exemptWater:false,
        dueFrom:'', active:true
      });
      n++; apts.push({
        id:'a'+n, no:n, floor, position:'شمال', isGround: floor===1,
        name:'', phone:'',
        exemptAm:false, exemptElevator:false, exemptWater:false,
        dueFrom:'', active:true
      });
    }
    return {
      settings:{
        building:'اتحاد ملاك عمارة 45 شارع سيبويه – الإسكندرية',
        openingBalance: 0,
        startMonth: currentMonth(),
        fees: { amMohamed: 140, elevator: 160, elevatorGround: 60, water: 50 }
      },
      apartments: apts,
      payments: [],
      expenses: [],
      charges: [],
      meta: { lastBackupAt: null }
    };
  }

  let db = null;

  function migrate(data){
    if(!data || !Array.isArray(data.apartments) || !data.apartments.length) return defaultData();
    data.settings = data.settings || {};
    // القفل على اسم العمارة الإلزامي
    data.settings.building = 'اتحاد ملاك عمارة 45 شارع سيبويه – الإسكندرية';
    data.settings.openingBalance = Number(data.settings.openingBalance)||0;
    data.settings.startMonth = data.settings.startMonth || currentMonth();
    data.settings.fees = data.settings.fees || {};
    data.settings.fees.amMohamed = Number(data.settings.fees.amMohamed)||140;
    data.settings.fees.elevator = Number(data.settings.fees.elevator)||160;
    data.settings.fees.elevatorGround = Number(data.settings.fees.elevatorGround)||60;
    data.settings.fees.water = Number(data.settings.fees.water)||50;

    data.apartments.forEach((a,i)=>{
      if(a.floor === undefined) a.floor = Math.ceil((i+1)/2);
      if(!a.position) a.position = (i%2 === 0) ? 'يمين' : 'شمال';
      if(a.isGround === undefined) a.isGround = a.floor === 1;
      if(a.active === undefined) a.active = true;
      if(a.exemptAm === undefined) a.exemptAm = false;
      if(a.exemptElevator === undefined) a.exemptElevator = false;
      if(a.exemptWater === undefined) a.exemptWater = false;
      if(a.dueFrom === undefined) a.dueFrom = '';
      delete a.amount;
    });

    data.payments = data.payments || [];
    data.payments.forEach(p=>{
      if(!p.components){
        p.components = { amMohamed:0, elevator:0, water:0, extra: Number(p.amount)||0 };
      }
      p.components.amMohamed = Number(p.components.amMohamed)||0;
      p.components.elevator = Number(p.components.elevator)||0;
      p.components.water = Number(p.components.water)||0;
      p.components.extra = Number(p.components.extra)||0;
    });

    data.expenses = data.expenses || [];
    data.charges = data.charges || [];
    data.meta = data.meta || {};
    data.meta.lastBackupAt = data.meta.lastBackupAt || null;
    return data;
  }

  let isSyncingFromFirebase = false;

  function save(){
    db.settings.building = 'اتحاد ملاك عمارة 45 شارع سيبويه – الإسكندرية';
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
    if(!isSyncingFromFirebase){
      set(ref(rtdb, 'buildingData'), db).catch(err => {
        console.error("Firebase sync error:", err);
      });
    }
  }

  function initApp(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    if(!raw){
      for(const k of OLD_KEYS){
        try{ raw = localStorage.getItem(k); if(raw) break; }catch(e){}
      }
    }
    let parsed = null;
    if(raw){ try{ parsed = JSON.parse(raw); }catch(e){} }
    db = migrate(parsed);

    // ربط الاستماع المباشر مع Firebase RTDB لمزامنة أي تغيير فوري
    onValue(ref(rtdb, 'buildingData'), (snapshot) => {
      const serverData = snapshot.val();
      if(serverData){
        isSyncingFromFirebase = true;
        db = migrate(serverData);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }catch(e){}
        render();
        isSyncingFromFirebase = false;
      } else {
        // إذا كانت القاعدة فارغة، يتم رفع البيانات الافتراضية/المحلية إليها
        save();
      }
    }, (error) => {
      console.error("Firebase read error:", error);
    });

    render();
    checkBackup();
    setInterval(checkBackup, 5 * 60 * 1000);
  }

  function aptStart(a){ return a.dueFrom || db.settings.startMonth; }
  function opening(){ return Number(db.settings.openingBalance)||0; }
  function fees(){ return db.settings.fees; }

  function aptLabel(a){ return `شقة ${a.no}`; }
  function aptFullLabel(a){ return `شقة ${a.no} – الدور ${a.floor} ${a.position}`; }
  function aptShortPos(a){ return `د${a.floor} ${a.position}`; }

  function aptMonthComponents(a){
    const f = fees();
    const amMohamed = a.exemptAm ? 0 : f.amMohamed;
    const elevator = a.exemptElevator ? 0 : (a.isGround ? f.elevatorGround : f.elevator);
    const water = a.exemptWater ? 0 : f.water;
    return { amMohamed, elevator, water };
  }
  function aptMonthTotal(a){
    const c = aptMonthComponents(a);
    return c.amMohamed + c.elevator + c.water;
  }
  function aptMonthlyDue(a){ return aptMonthTotal(a); }

  function aptChargesForMonth(a, month){
    let total = 0;
    db.charges.forEach(ch=>{
      const chMonth = (ch.date||'').slice(0,7);
      if(chMonth !== month) return;
      if(!Array.isArray(ch.aptIds) || !ch.aptIds.length) return;
      if(!ch.aptIds.includes(a.id)) return;
      total += roundHalf(Number(ch.total) / ch.aptIds.length);
    });
    return r0(total);
  }

  function aptDueForMonth(a, month){
    if(a.active === false) return { amMohamed:0, elevator:0, water:0, other:0, total:0 };
    if(monthDiff(aptStart(a), month) < 0) return { amMohamed:0, elevator:0, water:0, other:0, total:0 };
    const c = aptMonthComponents(a);
    const other = aptChargesForMonth(a, month);
    return {
      amMohamed: c.amMohamed,
      elevator: c.elevator,
      water: c.water,
      other,
      total: c.amMohamed + c.elevator + c.water + other
    };
  }

  function dueFor(a, upto){
    if(a.active === false) return 0;
    const start = aptStart(a);
    if(monthDiff(start, upto) < 0) return 0;
    let total = 0;
    monthRange(start, upto).forEach(m=>{
      total += aptMonthTotal(a);
      total += aptChargesForMonth(a, m);
    });
    return r0(total);
  }

  function aptDueInPeriod(a, from, to){
    let amMohamed=0, elevator=0, water=0, other=0;
    for(const m of monthRange(from, to)){
      if(a.active === false) continue;
      if(monthDiff(aptStart(a), m) < 0) continue;
      const c = aptMonthComponents(a);
      amMohamed += c.amMohamed;
      elevator += c.elevator;
      water += c.water;
      other += aptChargesForMonth(a, m);
    }
    return { amMohamed, elevator, water, other, total: amMohamed+elevator+water+other };
  }

  function paymentTotal(p){
    if(!p.components) return Number(p.amount)||0;
    const c = p.components;
    return (Number(c.amMohamed)||0) + (Number(c.elevator)||0) + (Number(c.water)||0) + (Number(c.extra)||0);
  }
  function paymentsOf(aptId){ return db.payments.filter(p=>p.apt === aptId); }
  function paidTotal(aptId){ return r0(paymentsOf(aptId).reduce((s,p)=>s+paymentTotal(p),0)); }
  function paidInMonth(aptId, month){
    return r0(db.payments.filter(p=>p.apt===aptId && p.month===month).reduce((s,p)=>s+paymentTotal(p),0));
  }
  function paidComponentsInMonth(aptId, month){
    const res = { amMohamed:0, elevator:0, water:0, other:0 };
    db.payments.filter(p=>p.apt===aptId && p.month===month).forEach(p=>{
      const c = p.components || { amMohamed:0, elevator:0, water:0, extra: Number(p.amount)||0 };
      res.amMohamed += Number(c.amMohamed)||0;
      res.elevator  += Number(c.elevator)||0;
      res.water     += Number(c.water)||0;
      res.other     += Number(c.extra)||0;
    });
    return res;
  }
  function paidComponentsInPeriod(aptId, from, to){
    const res = { amMohamed:0, elevator:0, water:0, other:0, total:0 };
    db.payments.filter(p=>p.apt===aptId && p.month >= from && p.month <= to).forEach(p=>{
      const c = p.components || { amMohamed:0, elevator:0, water:0, extra: Number(p.amount)||0 };
      res.amMohamed += Number(c.amMohamed)||0;
      res.elevator  += Number(c.elevator)||0;
      res.water     += Number(c.water)||0;
      res.other     += Number(c.extra)||0;
    });
    res.total = res.amMohamed + res.elevator + res.water + res.other;
    return res;
  }

  function expensesInMonth(month){ return sum(db.expenses.filter(e=>(e.date||'').slice(0,7)===month), 'amount'); }
  function collectedInMonth(month){ return r0(db.payments.filter(p=>p.month===month).reduce((s,p)=>s+paymentTotal(p),0)); }
  function totalCollected(){ return r0(db.payments.reduce((s,p)=>s+paymentTotal(p),0)); }
  function totalExpenses(){ return sum(db.expenses, 'amount'); }
  function balance(){ return r0(opening() + totalCollected() - totalExpenses()); }

  function monthStatus(a, month){
    if(a.active === false) return 'off';
    const due = aptDueForMonth(a, month).total;
    const paid = paidInMonth(a.id, month);
    if(due <= 0) return paid > 0 ? 'ok' : 'ok';
    if(paid >= due - 0.001) return 'ok';
    if(paid > 0) return 'part';
    return 'no';
  }
  function statusBadge(st){
    if(st === 'ok')   return '<span class="badge ok">✔ مسدد</span>';
    if(st === 'part') return '<span class="badge part">◐ جزئي</span>';
    if(st === 'off')  return '<span class="badge off">معفى</span>';
    return '<span class="badge no">✖ غير مسدد</span>';
  }

  function allMonths(){
    const set = new Set();
    set.add(db.settings.startMonth || currentMonth());
    set.add(currentMonth());
    db.payments.forEach(p=>p.month && set.add(p.month));
    db.expenses.forEach(e=>e.date && set.add(e.date.slice(0,7)));
    db.charges.forEach(c=>c.date && set.add(c.date.slice(0,7)));
    const arr = [...set].filter(Boolean).sort();
    if(!arr.length) return [currentMonth()];
    return monthRange(arr[0], arr[arr.length-1]);
  }

  function showModal(title, bodyHTML, onSubmit, wide){
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `
      <div class="modal ${wide?'wide':''}">
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button type="button" class="icon-btn" data-close>✕</button>
        </div>
        <form id="modalForm" autocomplete="off">
          ${bodyHTML}
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" data-close>إلغاء</button>
            <button type="submit" class="btn btn-primary">حفظ</button>
          </div>
        </form>
      </div>`;
    document.body.appendChild(back);
    const close = () => back.remove();
    back.addEventListener('click', e=>{
      if(e.target === back || e.target.closest('[data-close]')) close();
    });
    back.querySelector('#modalForm').addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      if(onSubmit(fd, back) !== false) close();
    });
    const first = back.querySelector('input,select,textarea');
    if(first) setTimeout(()=>first.focus(), 60);
    return back;
  }

      : (db.apartments.find(x=>x.id === aptId) || db.apartments[0]);

    const selMonth = isEdit ? existingPayment.month : cm;
    const dueData = aptDueForMonth(a, selMonth);
    const paidData = paidComponentsInMonth(a.id, selMonth);

      amMohamed: Math.max(0, dueData.amMohamed - paidData.amMohamed),

      water: Math.max(0, dueData.water - paidData.water),
      other: Math.max(0, dueData.other - paidData.other)

      ? (existingPayment.components || { amMohamed:0, elevator:0, water:0, extra: Number(existingPayment.amount)||0 })

    const methodOpts = methods.map(m=>`<option ${selMethod===m?'selected':''}>${m}</option>`).join('');

    const body = `

        ${a.isGround ? '<span style="background:#0891b2;color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;margin-inline-start:6px">دور أول</span>' : ''}
      </div>

      <div class="row4">
        <div class="field"><label>أم محمد <small style="color:#94a3b8">(مستحق ${fmt(dueData.amMohamed)})</small></label>
          <input type="number" name="amMohamed" min="0" step="0.01" value="${existingComponents.amMohamed||0}"></div>
        <div class="field"><label>أسانسير <small style="color:#94a3b8">(مستحق ${fmt(dueData.elevator)})</small></label>
          <input type="number" name="elevator" min="0" step="0.01" value="${existingComponents.elevator||0}"></div>
        <div class="field"><label>مياه <small style="color:#94a3b8">(مستحق ${fmt(dueData.water)})</small></label>
          <input type="number" name="water" min="0" step="0.01" value="${existingComponents.water||0}"></div>
        <div class="field"><label>صيانة متغيرة ${hasOther ? `<small style="color:#94a3b8">(مستحق ${fmt(dueData.other)})</small>` : ''}</label>
          <input type="number" name="extra" min="0" step="0.01" value="${existingComponents.extra||0}"></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;background:#f8fafc;padding:10px 14px;border-radius:10px;margin-bottom:12px">
        <div><strong>الإجمالي: <span id="payTotal">0</span> ج.م</strong></div>
        <div class="toolbar" style="margin:0">
          <button type="button" class="btn btn-outline btn-sm" data-fill="remain">تعبئة المتبقي</button>
          <button type="button" class="btn btn-outline btn-sm" data-fill="due">تعبئة المستحق كاملاً</button>
        </div>
      </div>

      <div class="row2">
        <div class="field"><label>تاريخ الدفع</label><input type="date" name="date" value="${selDate}" required></div>
        <div class="field"><label>طريقة الدفع</label><select name="method">${methodOpts}</select></div>
      </div>
      <div class="field"><label>ملاحظات</label><input name="note" value="${esc(selNote)}" placeholder="اختياري"></div>
    `;

    const back = showModal(isEdit ? 'تعديل دفعة' : 'تسجيل دفعة', body, (fd)=>{
      const comps = {
        amMohamed: parseFloat(fd.get('amMohamed'))||0,
        elevator:  parseFloat(fd.get('elevator'))||0,
        water:     parseFloat(fd.get('water'))||0,
        extra:     parseFloat(fd.get('extra'))||0
      };
      const total = comps.amMohamed + comps.elevator + comps.water + comps.extra;
      if(total <= 0){ alert('من فضلك أدخل مبلغاً أكبر من صفر'); return false; }
      const data = {
        apt: fd.get('apt'),
        month: fd.get('month'),
        components: comps,
        date: fd.get('date') || todayISO(),
        method: fd.get('method') || 'نقدي',
        note: (fd.get('note')||'').trim()
      };
      if(isEdit){
        const p = db.payments.find(x=>x.id === existingPayment.id);
        if(p){ Object.assign(p, data); delete p.amount; }
      } else {
        db.payments.push(Object.assign({id: uid()}, data));
      }
      save(); render();
    }, true);

    const form = back.querySelector('#modalForm');
    const inputs = ['amMohamed','elevator','water','extra'].map(n=>form.querySelector(`[name="${n}"]`));
    function updateTotal(){
      let t = 0;
      inputs.forEach(i=> t += parseFloat(i.value)||0);
      form.querySelector('#payTotal').textContent = fmt(t);
    }
    inputs.forEach(i=>i.addEventListener('input', updateTotal));
    updateTotal();

    form.querySelectorAll('[data-fill]').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(b.dataset.fill === 'remain'){
          inputs[0].value = remain.amMohamed || 0;
          inputs[1].value = remain.elevator || 0;
          inputs[2].value = remain.water || 0;
          inputs[3].value = remain.other || 0;
        } else {
          inputs[0].value = dueData.amMohamed || 0;
          inputs[1].value = dueData.elevator || 0;
          inputs[2].value = dueData.water || 0;
          inputs[3].value = dueData.other || 0;
        }
        updateTotal();
      });
    });
  }

  function openExpenseModal(existingExpense){
    const isEdit = !!existingExpense;
    const e = existingExpense || {};
    const allCats = [...new Set([...CATEGORIES, ...db.expenses.map(x=>x.category)])].filter(Boolean);
    const currentCat = isEdit ? (e.category || '') : '';
    const catOpts = allCats.map(c=>`<option value="${esc(c)}" ${c===currentCat?'selected':''}>${esc(c)}</option>`).join('');

    const body = `
      <div class="row2">
        <div class="field"><label>التاريخ</label><input type="date" name="date" value="${e.date||todayISO()}" required></div>
        <div class="field"><label>المبلغ (ج.م)</label><input type="number" name="amount" min="0" step="0.01" value="${e.amount||''}" required></div>
      </div>
      <div class="field">
        <label>بند الصرف</label>
        <select name="category" required>
          <option value="" disabled ${currentCat?'':'selected'}>— اختر البند من القائمة —</option>
          ${catOpts}
        </select>
      </div>
      <div class="field"><label>البيان / الوصف</label><input name="desc" value="${esc(e.desc||'')}"></div>
    `;
    showModal(isEdit ? 'تعديل مصروف' : 'إضافة مصروف', body, fd=>{
      const amt = parseFloat(fd.get('amount'));
      if(!(amt > 0)){ alert('من فضلك أدخل مبلغاً أكبر من صفر'); return false; }
      const cat = (fd.get('category')||'').trim();
      if(!cat){ alert('اختر بند الصرف'); return false; }
      const data = {
        date: fd.get('date') || todayISO(),
        category: cat,
        desc: (fd.get('desc')||'').trim(),
        amount: amt,
        note: ''
      };
      if(isEdit){
        const x = db.expenses.find(y=>y.id === existingExpense.id);
        if(x) Object.assign(x, data);
      } else {
        db.expenses.push(Object.assign({id: uid()}, data));
      }
      save(); render();
    });
  }

  function openChargeModal(existingCharge){
    const isEdit = !!existingCharge;
    const ch = existingCharge || { date: todayISO(), desc:'', total:0, aptIds: db.apartments.filter(a=>a.active!==false).map(a=>a.id) };

    const aptListHTML = db.apartments.map(a=>`
      <label>
        <input type="checkbox" name="aptSel" value="${a.id}" ${ch.aptIds.includes(a.id)?'checked':''}>
        <span>${aptLabel(a)} — ${esc(a.position)} ${a.isGround?'(أرضي)':''}</span>
      </label>
    `).join('');

    const body = `
      <div class="row2">
        <div class="field"><label>التاريخ</label><input type="date" name="date" value="${ch.date}" required></div>
        <div class="field"><label>المبلغ الإجمالي (ج.م)</label><input type="number" name="total" min="0" step="0.01" value="${ch.total||''}" required></div>
      </div>
      <div class="field"><label>البيان / سبب الصيانة</label><input name="desc" value="${esc(ch.desc||'')}" placeholder="مثال: إصلاح السلالم" required></div>
      <div class="field">
        <label>الشقق المشاركة في الدفع</label>
        <div class="charge-apt-list">${aptListHTML}</div>
      </div>
      <div class="charge-summary" id="chargePreview">اختر الشقق والمبلغ لعرض نصيب كل شقة</div>
    `;

    const back = showModal(isEdit ? 'تعديل مبلغ صيانة' : 'إضافة مبلغ صيانة متغيرة', body, (fd)=>{
      const total = parseFloat(fd.get('total'));
      if(!(total > 0)){ alert('أدخل مبلغاً أكبر من صفر'); return false; }
      const aptIds = fd.getAll('aptSel');
      if(!aptIds.length){ alert('حدد شقة واحدة على الأقل'); return false; }
      const data = {
        date: fd.get('date') || todayISO(),
        desc: (fd.get('desc')||'').trim() || 'صيانة',
        total,
        aptIds
      };
      if(isEdit){
        const x = db.charges.find(y=>y.id === existingCharge.id);
        if(x) Object.assign(x, data);
      } else {
        db.charges.push(Object.assign({id: uid()}, data));
      }
      save(); render();
    }, true);

    const form = back.querySelector('#modalForm');
    function updatePreview(){
      const total = parseFloat(form.querySelector('[name="total"]').value)||0;
      const selected = form.querySelectorAll('[name="aptSel"]:checked').length;
      const el = form.querySelector('#chargePreview');
      if(selected === 0){ el.textContent = 'اختر شقة واحدة على الأقل'; }
      else if(total <= 0){ el.textContent = 'أدخل المبلغ الإجمالي'; }
      else {
        const per = roundHalf(total/selected);
        el.innerHTML = `<strong>${selected}</strong> شقة × <strong>${fmt(per)} ج.م</strong>`;
      }
    }
    form.addEventListener('input', updatePreview);
    form.addEventListener('change', updatePreview);
    updatePreview();
  }

  function openStatement(aptId){
    const a = db.apartments.find(x=>x.id === aptId);
    if(!a) return;
    const pays = paymentsOf(a.id).sort((x,y)=>(x.date||'').localeCompare(y.date||''));
    const due = dueFor(a, currentMonth());
    const paid = paidTotal(a.id);
    const bal = paid - due;

    const rows = pays.length ? pays.map(p=>{
      const c = p.components || { amMohamed:0, elevator:0, water:0, extra: Number(p.amount)||0 };
      return `<tr>
        <td class="num">${esc(p.date)}</td><td>${monthLabel(p.month)}</td>
        <td class="num">${fmt(c.amMohamed)}</td>
        <td class="num">${fmt(c.elevator)}</td>
        <td class="num">${fmt(c.water)}</td>
        <td class="num">${fmt(c.extra)}</td>
        <td class="num" style="font-weight:700;color:#15803d">${fmt(paymentTotal(p))}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="7"><div class="empty">لا توجد دفعات</div></td></tr>`;

    const body = `
      <div class="stats" style="margin-bottom:14px">
        <div class="stat"><div class="label">إجمالي المستحق</div><div class="value" style="font-size:17px">${fmt(due)}</div></div>
        <div class="stat green"><div class="label">إجمالي المدفوع</div><div class="value" style="font-size:17px">${fmt(paid)}</div></div>
        <div class="stat ${bal<0?'red':''}"><div class="label">${bal<0?'المتأخر':'الرصيد الدائن'}</div><div class="value" style="font-size:17px">${fmt(Math.abs(bal))}</div></div>
      </div>
      <div class="table-wrap"><table style="min-width:auto">
        <thead><tr><th>التاريخ</th><th>عن شهر</th><th>أم محمد</th><th>أسانسير</th><th>مياه</th><th>صيانة متغيرة</th><th>الإجمالي</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    `;

    const back = showModal(`كشف حساب – ${aptFullLabel(a)}`, body, ()=>true, true);
    const actions = back.querySelector('.modal-actions');
    if(actions) actions.innerHTML = '<button type="button" class="btn btn-primary" data-close>إغلاق</button>';
    const submitBtn = back.querySelector('button[type=submit]');
    if(submitBtn) submitBtn.style.display = 'none';
  }

  async function exportToPDF(){
    const fromEl = document.getElementById('pdfFrom');
    const toEl   = document.getElementById('pdfTo');
    const from = (fromEl && fromEl.value) || db.settings.startMonth;
    const to   = (toEl   && toEl.value)   || currentMonth();
    if(!window.jspdf || !window.html2canvas){ alert('مكتبات PDF لم يتم تحميلها.'); return; }
    window.print();
  }

  function exportPaymentsXLSX(){
    if(!window.XLSX){ alert('مكتبة Excel لم تُحمّل بعد'); return; }
    const headers = ['التاريخ','الشقة','الدور','عن شهر','أم محمد','أسانسير','مياه','صيانة متغيرة','الإجمالي','طريقة الدفع'];
    const rows = [headers];
    db.payments.forEach(p=>{
      const a = db.apartments.find(x=>x.id===p.apt);
      const c = p.components || { amMohamed:0, elevator:0, water:0, extra: Number(p.amount)||0 };
      rows.push([p.date, a?aptLabel(a):'', a?a.floor:'', p.month, c.amMohamed||0, c.elevator||0, c.water||0, c.extra||0, paymentTotal(p), p.method||'']);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'الدفعات');
    XLSX.writeFile(wb, `الدفعات-${todayISO()}.xlsx`);
  }

  function exportExpensesXLSX(){
    if(!window.XLSX){ alert('مكتبة Excel لم تُحمّل بعد'); return; }
    const headers = ['التاريخ','البند','البيان','المبلغ'];
    const rows = [headers];
    db.expenses.forEach(e=>{ rows.push([e.date, e.category, e.desc||'', Number(e.amount)||0]); });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المصروفات');
    XLSX.writeFile(wb, `المصروفات-${todayISO()}.xlsx`);
  }

  function checkBackup(){
    const last = db.meta.lastBackupAt;
    const now = Date.now();
    const twelveHoursMs = BACKUP_HOURS * 60 * 60 * 1000;
    const banner = $('#backupBanner');
    if(!banner) return;
    if(state.backupDismissedUntil && now < state.backupDismissedUntil){ banner.style.display = 'none'; return; }
    if(!last || (now - last) > twelveHoursMs){
      banner.style.display = 'flex';
    } else {
      banner.style.display = 'none';
    }
  }
  function takeBackupNow(){
    const name = `نسخة-احتياطية-اتحاد-الملاك-${todayISO()}.json`;
    download(name, JSON.stringify(db, null, 2));
    db.meta.lastBackupAt = Date.now();
    save();
    $('#backupBanner').style.display = 'none';
  }
  function dismissBackupBanner(){
    state.backupDismissedUntil = Date.now() + 60*60*1000;
    $('#backupBanner').style.display = 'none';
  }
  window.takeBackupNow = takeBackupNow;
  window.dismissBackupBanner = dismissBackupBanner;

  document.getElementById('tabs').addEventListener('click', e=>{
    const t = e.target.closest('.tab');
    if(!t) return;
    state.tab = t.dataset.tab;
    render();
  });

  document.getElementById('main').addEventListener('click', e=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const act = btn.dataset.action;
    const id = btn.dataset.id;

    switch(act){
      case 'goto-collect': state.tab = 'collect'; state.month = currentMonth(); render(); break;
      case 'pay': openPaymentModal(id); break;
      case 'edit-pay': {
        const p = db.payments.find(x=>x.id === id);
        if(p) openPaymentModal(p.apt, p);
        break;
      }
      case 'del-pay': {
        if(confirm('حذف هذه الدفعة؟')){
          db.payments = db.payments.filter(x=>x.id !== id);
          save(); render();
        }
        break;
      }
      case 'del-month': {
        const m = btn.dataset.month;
        if(confirm('حذف دفعات هذا الشهر للشقة؟')){
          db.payments = db.payments.filter(p=>!(p.apt===id && p.month===m));
          save(); render();
        }
        break;
      }
      case 'add-expense': openExpenseModal(); break;
      case 'edit-exp': {
        const x = db.expenses.find(y=>y.id === id);
        if(x) openExpenseModal(x);
        break;
      }
      case 'del-expense': {
        if(confirm('حذف هذا المصروف؟')){
          db.expenses = db.expenses.filter(x=>x.id !== id);
          save(); render();
        }
        break;
      }
      case 'add-charge': openChargeModal(); break;
      case 'edit-charge': {
        const c = db.charges.find(x=>x.id===id);
        if(c) openChargeModal(c);
        break;
      }
      case 'del-charge': {
        if(confirm('حذف بند الصيانة؟')){
          db.charges = db.charges.filter(x=>x.id !== id);
          save(); render();
        }
        break;
      }
      case 'month-prev': {
        const [y,m] = state.month.split('-').map(Number);
        const d = new Date(y, m-2, 1);
        state.month = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        render(); break;
      }
      case 'month-next': {
        const [y,m] = state.month.split('-').map(Number);
        const d = new Date(y, m, 1);
        state.month = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        render(); break;
      }
      case 'month-now': state.month = currentMonth(); render(); break;

      case 'del-apt': {
        if(confirm('حذف هذه الشقة؟')){
          db.apartments = db.apartments.filter(x=>x.id !== id);
          db.payments = db.payments.filter(p=>p.apt !== id);
          save(); render();
        }
        break;
      }
      case 'statement': openStatement(id); break;

      case 'save-settings': {
        const o = parseFloat($('#setOpening').value);
        const s = $('#setStart').value;
        const fAm = parseFloat($('#feeAmMohamed').value);
        const fEl = parseFloat($('#feeElevator').value);
        const fElG = parseFloat($('#feeElevatorGround').value);
        const fWa = parseFloat($('#feeWater').value);
        
        db.settings.building = 'اتحاد ملاك عمارة 45 شارع سيبويه – الإسكندرية';
        if(!isNaN(o)) db.settings.openingBalance = o;
        if(s) db.settings.startMonth = s;
        if(fAm >= 0) db.settings.fees.amMohamed = fAm;
        if(fEl >= 0) db.settings.fees.elevator = fEl;
        if(fElG >= 0) db.settings.fees.elevatorGround = fElG;
        if(fWa >= 0) db.settings.fees.water = fWa;
        save(); render();
        alert('✔ تم حفظ الإعدادات ومزامنتها سحابياً');
        break;
      }

      case 'export-pdf': exportToPDF(); break;
      case 'export-pay-xlsx': exportPaymentsXLSX(); break;
      case 'export-exp-xlsx': exportExpensesXLSX(); break;

      case 'export-json': takeBackupNow(); break;
      case 'import-json': $('#fileImport').click(); break;

      case 'clear-tx': {
        if(confirm('⚠️ سيتم حذف جميع الدفعات والمصروفات من السحابة؟')){
          db.payments = []; db.expenses = [];
          save(); render();
          alert('✔ تم الحذف');
        }
        break;
      }
      case 'reset-all': {
        if(confirm('⚠️ سيتم إعادة ضبط البيانات تماماً بالوضع الافتراضي؟')){
          db = defaultData();
          save();
          state.month = currentMonth();
          state.tab = 'home';
          render();
          alert('✔ تم إعادة الضبط');
        }
        break;
      }
      case 'print': window.print(); break;
    }
  });

  document.getElementById('main').addEventListener('change', e=>{
    const t = e.target;
    if(t.matches('[data-month-picker]')){ state.month = t.value || currentMonth(); render(); return; }
    if(t.dataset.filter === 'expMonth'){ state.expMonth = t.value; render(); return; }
    if(t.dataset.filter === 'expCat'){ state.expCat = t.value; render(); return; }
    if(t.dataset.filter === 'payMonth'){ state.payMonth = t.value; render(); return; }
    if(t.dataset.filter === 'payApt'){ state.payApt = t.value; render(); return; }
    if(t.id === 'pdfFrom'){ state.pdfFrom = t.value; return; }
    if(t.id === 'pdfTo'){ state.pdfTo = t.value; return; }

    const inp = t.closest('[data-field]');
    if(inp){
      const a = db.apartments.find(x=>x.id === inp.dataset.id);
      if(!a) return;
      const f = inp.dataset.field;
      if(f === 'active')              a.active = inp.checked;
      else if(f === 'isGround')       a.isGround = inp.checked;
      else if(f === 'includeAm')      a.exemptAm = !inp.checked;
      else if(f === 'includeElevator')a.exemptElevator = !inp.checked;
      else if(f === 'includeWater')   a.exemptWater = !inp.checked;
      else if(f === 'floor')          a.floor = parseInt(inp.value)||1;
      else                            a[f] = inp.value;
      save(); render();
    }
  });

  document.addEventListener('change', e=>{
    if(e.target && e.target.id === 'fileImport'){
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        try{
          const data = JSON.parse(ev.target.result);
          if(!data || !Array.isArray(data.apartments)) throw new Error('ملف غير صالح');
          if(confirm('سيتم استبدال كل البيانات بالبيانات المستوردة ومزامنتها سحابياً. المتابعة؟')){
            db = migrate(data);
            save();
            state.tab='home'; render();
            alert('✔ تم استعادة البيانات بنجاح');
          }
        }catch(err){
          alert('❌ تعذر قراءة الملف: ' + err.message);
        }
        e.target.value = '';
      };
      reader.readAsText(f);
    }
  });

  // بدء تشغيل التطبيق وربطه بقاعدة البيانات
  initApp();
</script>
</body>
</html>
